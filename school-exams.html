<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Luyện đề thi tiếng Anh THCS và THPT theo lớp, giữa kì, cuối kì và ôn thi.">
  <title>Đề thi THCS &amp; THPT – EnglishFull</title>
  <style>
    :root{--n9:#061733;--n8:#0a2350;--n7:#0f3170;--n6:#164192;--blue:#2563eb;--sky:#38bdf8;--bg:#eef2f9;--ink:#0b1b3a;--muted:#5b6b8c;--line:#d9e2f3}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:var(--bg);color:var(--ink);font:16px/1.6 'Times New Roman',Times,serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}
    .site-header{position:sticky;top:0;z-index:20;background:rgba(6,23,51,.96);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1);color:#fff}.hd-in{max-width:1120px;margin:auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:10px;color:#fff}.logo svg{width:44px;height:44px;flex:none}.logo b{display:block;font-size:1.2rem;line-height:1.1;letter-spacing:.3px}.logo small{display:block;font-size:.74rem;opacity:.75;line-height:1.2;font-style:italic}.nav{display:flex;gap:4px}.nav a{color:#dbe7ff;padding:8px 13px;border-radius:99px;font-weight:600;font-size:.93rem}.nav a:hover{background:#ffffff1f}.nav a.active{background:#fff;color:var(--n8)}
    .hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:42px 16px 100px;background:radial-gradient(900px 420px at 85% -10%,rgba(56,189,248,.28),transparent 60%),radial-gradient(700px 380px at -5% 110%,rgba(37,99,235,.45),transparent 60%),linear-gradient(135deg,#061733 0%,#0c2a63 55%,#1a4a9c 100%)}.hero:before{content:"";position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);pointer-events:none}.hero-in{position:relative;max-width:800px;margin:auto}.badge{display:inline-block;padding:5px 16px;border:1px solid #ffffff55;background:#ffffff14;border-radius:99px;font-size:.88rem}.hero h1{margin:9px 0 5px;font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.18}.hero p{margin:0;color:#dbe7ff;font-size:1.08rem;font-style:italic}
    .wrap{position:relative;max-width:1120px;margin:-44px auto 0;padding:0 14px 40px}.filters-panel{padding:20px 22px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px #0617331a}.filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.filters label{display:grid;gap:5px;color:var(--muted);font-size:.88rem;font-weight:700}.filters select,.filters input{min-width:180px;border:1px solid #cbd6e4;border-radius:9px;background:#fff;padding:10px 12px;font:inherit;color:var(--ink)}.filters input{min-width:min(280px,80vw)}.count{margin:14px 0 10px;color:var(--muted);font-size:.92rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}.card{position:relative;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:190px;padding:18px 18px 18px 22px;border:1.5px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 5px 18px #0617330d;transition:.18s}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(180deg,var(--blue),var(--sky))}.card:hover{border-color:#7f9fdc;background:#f5f8ff;transform:translateY(-3px);box-shadow:0 12px 24px #0f317024}.tag{align-self:flex-start;padding:2px 11px;border-radius:99px;background:#e4ecfb;color:var(--n7);font-size:.8rem;font-weight:700}.card h2{margin:1px 0;color:var(--n7);font-size:1.12rem}.card p{flex:1;margin:0;color:var(--muted);font-size:.94rem}.meta{color:var(--muted);font-size:.9rem}.go{margin-top:2px;color:var(--blue);font-weight:700;font-size:.92rem}.state{padding:26px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:center;color:var(--muted)}footer{padding:22px 14px;background:var(--n9);color:#c7d6f5;text-align:center;font-size:.9rem}
    @media(max-width:600px){.hd-in{align-items:flex-start;flex-direction:column}.nav{width:100%;justify-content:center}.nav a{padding:7px 9px;font-size:.85rem}.hero{padding:34px 15px 78px}.filters-panel{padding:16px}.filters label,.filters select,.filters input{width:100%}}
  </style>
</head>
<body>
  <header class="site-header"><div class="hd-in">
    <a class="logo" href="index.html" aria-label="EnglishFull – về trang chủ">
      <svg viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 64V28c7-4 20-1 27 3v36c-7-4-20-7-27-3Z"/><path d="M45 31c7-4 20-7 27-3v22M45 67c7-4 20-7 27-3"/><path d="M30 40h15M30 51h10M28 51l17 0 17-18 16-16M64 17h14v14" stroke-width="7"/></g></svg>
      <span><b>EnglishFull</b><small>Full English is here</small></span>
    </a>
    <nav class="nav" aria-label="Điều hướng"><a href="index.html">Trang chủ</a><a class="active" href="school-exams.html">Đề thi</a><a href="exercises.html">Bài tập</a><a href="history.html">Lịch sử</a></nav>
  </div></header>
  <section class="hero"><div class="hero-in"><span class="badge">THCS &amp; THPT</span><h1>Đề thi tiếng Anh</h1><p>Luyện theo lớp, kỳ kiểm tra và dạng đề</p></div></section>
  <main class="wrap">
    <section class="filters-panel"><div id="filters" class="filters"></div></section>
    <p id="count" class="count"></p>
    <div id="list"><div class="state">Đang tải danh sách đề…</div></div>
  </main>
  <footer>EnglishFull · Full English is here</footer>
  <script>
    const BASE='https://script.google.com/macros/s/AKfycbwtDxkcEL5lDNPBt0gxe0P59rb2HZacd9z6CVXbHWYlA17s2w2hRcD7UyRVx7PZ1IJn/exec';
    let exams=[],level='',kind='',search='';const $=id=>document.getElementById(id);
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
    function parts(x){return String(x.group||'Khác').split(/\s*[·|]\s*/).map(v=>v.trim()).filter(Boolean)}
    function levelOf(x){const p=parts(x),s=p.find(v=>/^THCS$|^THPT$/i.test(v)),g=p.find(v=>/^Lớp\s+\d+/i.test(v));return [s,g].filter(Boolean).join(' · ')||'Khác'}
    function kindOf(x){return parts(x).filter(v=>!/^THCS$|^THPT$/i.test(v)&&!/^Lớp\s+\d+/i.test(v)).join(' · ')||'Khác'}
    function select(id,label,vals){return '<label>'+label+'<select id="'+id+'"><option value="">Tất cả</option>'+vals.map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label>'}
    function draw(){
      const shown=exams.filter(x=>(!level||levelOf(x)===level)&&(!kind||kindOf(x)===kind)&&(!search||norm([x.title,x.desc,x.group].join(' ')).includes(norm(search))));
      $('count').textContent=shown.length+' đề';
      $('list').innerHTML=shown.length?'<div class="grid">'+shown.map(x=>'<a class="card" href="school-session.html?id='+encodeURIComponent(x.id)+'"><span class="tag">'+esc(x.group)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.desc)+'</p><span class="meta">'+(x.duration||'—')+' phút</span><span class="go">Mở đề thi ›</span></a>').join('')+'</div>':'<div class="state">Không có đề phù hợp. Hãy đổi bộ lọc hoặc thử từ khóa khác.</div>';
    }
    function setup(){
      const levels=[...new Set(exams.map(levelOf))].sort((a,b)=>a.localeCompare(b,'vi'));
      const kinds=[...new Set(exams.map(kindOf))].sort((a,b)=>a.localeCompare(b,'vi'));
      $('filters').innerHTML=select('level','Cấp / lớp',levels)+select('kind','Kỳ / dạng đề',kinds)+'<label for="search">Tìm đề<input id="search" type="search" placeholder="Ví dụ: lớp 9, cuối kì II"></label>';
      $('level').onchange=()=>{level=$('level').value;draw()};$('kind').onchange=()=>{kind=$('kind').value;draw()};$('search').oninput=()=>{search=$('search').value;draw()};
    }
    fetch(BASE+'?api=exam_list&track=school').then(r=>r.json()).then(r=>{if(!r.success)throw Error(r.message||'Không tải được danh sách');exams=r.data||[];setup();draw()}).catch(e=>{$('count').textContent='';$('list').innerHTML='<div class="state">'+esc(e.message)+'</div>'});
  </script>
</body>
</html>
