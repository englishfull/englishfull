<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Lý thuyết Ngữ pháp Tiếng Anh – EnglishFull</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    /* Gradient Hero */
    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      text-align: center;
      padding: 56px 16px 110px;
      background: radial-gradient(900px 420px at 85% -10%, rgba(56,189,248,.28), transparent 60%),
                  linear-gradient(135deg, #061733 0%, #0c2a63 55%, #1a4a9c 100%);
    }
    .hero-in { position: relative; max-width: 820px; margin: 0 auto; }
    .badge { display: inline-block; padding: 5px 16px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); border-radius: 99px; font-size: .88rem; margin-bottom: 14px; }
    .hero h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.2; font-weight: 700; }
    .hero p { margin: 0; opacity: .9; font-style: italic; font-size: 1.05rem; }

    /* Layout chính */
    .wrap { max-width: 1120px; margin: -50px auto 0; padding: 0 14px 50px; position: relative; }
    
    /* Thanh công cụ Tìm kiếm & Filter Chips */
    .tools-card { background: #fff; border: 1px solid var(--line, #dfe6eb); border-radius: 18px; padding: 16px 20px; box-shadow: 0 10px 30px rgba(6,23,51,.10); margin-bottom: 22px; }
    .search-input { width: 100%; padding: 12px 16px; border: 1.5px solid #bcd0f2; border-radius: 12px; font-size: 1rem; background: #f6f9ff; outline: none; transition: .15s; }
    .search-input:focus { border-color: #1a4a9c; background: #fff; box-shadow: 0 0 0 3px rgba(26,74,156,.12); }
    
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-top: 12px; -webkit-overflow-scrolling: touch; }
    .chip { border: 1.5px solid #bcd0f2; background: #fff; color: #10263c; padding: 7px 16px; border-radius: 99px; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; transition: .15s; }
    .chip:hover { background: #eef3fd; }
    .chip.active { background: #061733; border-color: #061733; color: #fff; }

    /* Grid Thẻ lý thuyết */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .card { display: flex; flex-direction: column; gap: 10px; background: #fff; border: 1.5px solid var(--line, #dfe6eb); border-radius: 16px; padding: 20px; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(6,23,51,.06); transition: .2s; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #1a4a9c, #38bdf8); }
    .card:hover { transform: translateY(-3px); border-color: #7f9fdc; box-shadow: 0 12px 28px rgba(15,49,112,.14); }
    
    .tag { align-self: flex-start; padding: 3px 12px; border-radius: 99px; font-size: .78rem; font-weight: 700; background: #e4ecfb; color: #0f3170; }
    .card h3 { margin: 0; font-size: 1.2rem; color: #0a2350; }
    .card p { margin: 0; color: #5b6b8c; font-size: .95rem; line-height: 1.5; flex: 1; }
    
.card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 12px; border-top: 1px solid #edf2f7; }    .btn-read { border: 0; background: #e4ecfb; color: #0f3170; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: .88rem; transition: .15s; }
    .btn-read:hover { background: #d3e0f8; }
    .link-practice { font-weight: 700; color: #1a4a9c; font-size: .88rem; text-decoration: none; display: inline-flex; align-items: center; }
    .link-practice:hover { text-decoration: underline; }

    /* Modal Xem lý thuyết chi tiết */
    .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(6,23,51,.65); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; width: 100%; max-width: 720px; max-height: 85vh; border-radius: 20px; overflow-y: auto; box-shadow: 0 20px 50px rgba(6,23,51,.3); padding: 28px; position: relative; font-family: 'Times New Roman', Times, serif; }
    .modal-close { position: absolute; top: 18px; right: 20px; border: 0; background: #f1f5f9; color: #475569; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
    .modal-close:hover { background: #e2e8f0; }
    .modal-title { margin: 0 0 6px; font-size: 1.6rem; color: #0a2350; }
    .modal-tag { display: inline-block; padding: 2px 10px; border-radius: 99px; background: #e4ecfb; color: #0f3170; font-size: .82rem; font-weight: 700; margin-bottom: 16px; }
    .modal-content { font-size: 1.05rem; line-height: 1.7; color: #1e293b; }
    .modal-content h4 { color: #0f3170; margin: 18px 0 6px; font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; }
    .modal-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .95rem; }
    .modal-content th, .modal-content td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
    .modal-content th { background: #f8fafc; color: #0f3170; }
    .formula-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-left: 4px solid #16a34a; padding: 10px 14px; border-radius: 8px; margin: 10px 0; font-weight: 600; color: #166534; }
  </style>
</head>
<body>

  <!-- Header dùng chung -->
  <div id="ef-header"></div>

  <!-- Hero Banner -->
  <section class="hero">
    <div class="hero-in">
      <span class="badge">Kho Kiến Thức & Ngữ Pháp</span>
      <h1>Lý thuyết Tiếng Anh Tổng quát</h1>
      <p>Hệ thống toàn bộ công thức, cấu trúc ngữ pháp và mẹo làm bài chi tiết từ cơ bản đến nâng cao.</p>
    </div>
  </section>

  <!-- Khung nội dung chính -->
  <main class="wrap">
    
    <!-- Thanh Tìm kiếm & Bộ lọc -->
    <div class="tools-card">
      <input type="search" id="search" class="search-input" placeholder="Tìm kiếm công thức, tên thì, từ loại..." autocomplete="off">
      <div class="chips" id="chips">
        <button class="chip active" data-group="all">Tất cả</button>
        <button class="chip" data-group="Thì tiếng Anh">12 Thì tiếng Anh</button>
        <button class="chip" data-group="Từ loại">Từ loại (N/V/Adj/Adv)</button>
        <button class="chip" data-group="Cấu trúc câu">Cấu trúc câu</button>
        <button class="chip" data-group="Mệnh đề">Mệnh đề & Quan hệ</button>
        <button class="chip" data-group="IELTS Grammar">IELTS Grammar</button>
      </div>
    </div>

    <!-- Danh sách Card Lý thuyết -->
    <div class="grid" id="grammarGrid"></div>

  </main>

  <!-- Modal xem chi tiết -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <span class="modal-tag" id="mTag">Chuyên đề</span>
      <h2 class="modal-title" id="mTitle">Tiêu đề ngữ pháp</h2>
      <div class="modal-content" id="mBody"></div>
    </div>
  </div>

  <!-- Footer dùng chung -->
  <div id="ef-footer"></div>

  <!-- Scripts -->
  <script src="assets/js/core/util.js"></script>
  <script src="assets/js/core/auth.js"></script>
  <script src="assets/js/core/layout.js"></script>

  <script>
    // 1. Mount Header & Footer
    EF.layout.mountHeader(document.getElementById('ef-header'), { active: 'theory' });
    EF.layout.mountFooter(document.getElementById('ef-footer'));

    // 2. Cơ sở dữ liệu Lý thuyết Ngữ pháp
    const GRAMMAR_DATA = [
      {
        id: 'present-simple',
        group: 'Thì tiếng Anh',
        title: 'Thì Hiện Tại Đơn (Present Simple)',
        desc: 'Diễn tả thói quen, hành động lặp đi lặp lại hoặc sự thật hiển nhiên.',
        formula: 'S + V(s/es) | S + do/does + not + V',
        practiceUrl: 'exercises.html?group=Thì%20tiếng%20Anh',
        body: `
          <h4>1. Công thức cơ bản</h4>
          <div class="formula-box">(+) S + V(s/es)<br>(-) S + do/does + NOT + V-bare<br>(?) Do/Does + S + V-bare?</div>
          <h4>2. Cách sử dụng chính</h4>
          <ul>
            <li><b>Sự thật hiển nhiên:</b> The sun rises in the East.</li>
            <li><b>Thói quen hàng ngày:</b> I go to school every morning.</li>
            <li><b>Lịch trình cố định:</b> The train leaves at 7:00 AM.</li>
          </ul>
          <h4>3. Dấu hiệu nhận biết</h4>
          <p>Xuất hiện các trạng từ chỉ tần suất: <i>always, usually, often, sometimes, never, every day/week/month...</i></p>
        `
      },
      {
        id: 'past-simple',
        group: 'Thì tiếng Anh',
        title: 'Thì Quá Khứ Đơn (Past Simple)',
        desc: 'Diễn tả hành động đã xảy ra và kết thúc hoàn toàn trong quá khứ.',
        formula: 'S + V2/ed | S + did + not + V',
        practiceUrl: 'exercises.html?group=Thì%20tiếng%20Anh',
        body: `
          <h4>1. Công thức cơ bản</h4>
          <div class="formula-box">(+) S + V2/ed<br>(-) S + did + NOT + V-bare<br>(?) Did + S + V-bare?</div>
          <h4>2. Cách sử dụng chính</h4>
          <ul>
            <li>Hành động diễn ra và kết thúc tại một thời điểm xác định trong quá khứ.</li>
            <li>Chuỗi hành động xảy ra liên tiếp trong quá khứ.</li>
          </ul>
          <h4>3. Dấu hiệu nhận biết</h4>
          <p><i>yesterday, ago, last week/month/year, in 1999...</i></p>
        `
      },
      {
        id: 'passive-voice',
        group: 'Cấu trúc câu',
        title: 'Câu Bị Động (Passive Voice)',
        desc: 'Nhấn mạnh vào đối tượng chịu tác động của hành động thay vì người thực hiện.',
        formula: 'S + Be + V3/ed + (by O)',
        practiceUrl: 'exercises.html',
        body: `
          <h4>1. Nguyên tắc chuyển đổi sang Bị động</h4>
          <p><b>Chủ động:</b> S + V + O <br> <b>Bị động:</b> S' (O cũ) + Be + V3/ed + (by O' cũ)</p>
          <h4>2. Bảng chia Động từ "Be" theo thì</h4>
          <table>
            <tr><th>Thì</th><th>Dạng Bị động</th></tr>
            <tr><td>Hiện tại đơn</td><td>is / am / are + V3/ed</td></tr>
            <tr><td>Quá khứ đơn</td><td>was / were + V3/ed</td></tr>
            <tr><td>Hiện tại hoàn thành</td><td>have / has been + V3/ed</td></tr>
            <tr><td>Động từ khuyết thiếu</td><td>can / will / must + be + V3/ed</td></tr>
          </table>
        `
      },
      {
        id: 'conditionals',
        group: 'Cấu trúc câu',
        title: 'Câu Điều Kiện (Conditionals Type 1, 2, 3)',
        desc: 'Cấu trúc diễn tả giả định về điều kiện và kết quả có thể xảy ra.',
        formula: 'If + S + V..., S + Will/Would + V',
        practiceUrl: 'exercises.html',
        body: `
          <h4>1. Điều kiện Loại 1 (Có thật ở hiện tại/tương lai)</h4>
          <div class="formula-box">If + S + V(hiện tại đơn), S + will/can + V-bare</div>
          <h4>2. Điều kiện Loại 2 (Không có thật ở hiện tại)</h4>
          <div class="formula-box">If + S + V2/was/were, S + would/could + V-bare</div>
          <h4>3. Điều kiện Loại 3 (Không có thật trong quá khứ)</h4>
          <div class="formula-box">If + S + had + V3/ed, S + would/could + have + V3/ed</div>
        `
      },
      {
        id: 'relative-clauses',
        group: 'Mệnh đề',
        title: 'Mệnh Đề Quan Hệ (Relative Clauses)',
        desc: 'Sử dụng Who, Whom, Which, That, Whose để bổ nghĩa cho danh từ đứng trước.',
        formula: 'Noun + Who / Which / That + Clause',
        practiceUrl: 'exercises.html',
        body: `
          <h4>1. Đại từ quan hệ chính</h4>
          <ul>
            <li><b>Who:</b> Thay thế cho người (chủ ngữ). <i>Ex: The man who lives next door.</i></li>
            <li><b>Whom:</b> Thay thế cho người (tân ngữ).</li>
            <li><b>Which:</b> Thay thế cho vật/sự việc.</li>
            <li><b>That:</b> Thay thế cho cả người và vật trong mệnh đề xác định.</li>
            <li><b>Whose:</b> Chỉ sở hữu (whose + Noun).</li>
          </ul>
        `
      },
      {
        id: 'ielts-paraphrasing',
        group: 'IELTS Grammar',
        title: 'Kỹ Thuật Paraphrase trong IELTS Writing & Speaking',
        desc: 'Phương pháp đổi cấu trúc câu và dùng từ đồng nghĩa để nâng Band điểm.',
        formula: 'Synonyms + Passive + Nominalization',
        practiceUrl: 'ielts.html',
        body: `
          <h4>1. Các phương pháp Paraphrase phổ biến</h4>
          <ul>
            <li><b>Dùng từ đồng nghĩa (Synonyms):</b> <i>important &rarr; crucial / vital / essential</i>.</li>
            <li><b>Chuyển từ Chủ động sang Bị động:</b> Đổi góc nhìn của câu.</li>
            <li><b>Danh từ hóa (Nominalization):</b> Chuyển Động từ/Tính từ thành Danh từ (<i>solve &rarr; solution</i>).</li>
          </ul>
        `
      }
    ];

    // 3. Render danh sách Card
    let currentGroup = 'all';
    let searchQuery = '';

    function renderGrid() {
      const grid = document.getElementById('grammarGrid');
      const filtered = GRAMMAR_DATA.filter(item => {
        const matchGroup = currentGroup === 'all' || item.group === currentGroup;
        const matchSearch = (item.title + ' ' + item.desc + ' ' + item.group).toLowerCase().includes(searchQuery.toLowerCase());
        return matchGroup && matchSearch;
      });

      if (!filtered.length) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Không tìm thấy chuyên đề lý thuyết phù hợp.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <span class="tag">${item.group}</span>
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <div class="card-actions">
            <button class="btn-read" onclick="openModal('${item.id}')">📖 Đọc lý thuyết</button>
            <a href="${item.practiceUrl}" class="link-practice">Luyện tập ›</a>
          </div>
        </div>
      `).join('');
    }

    // 4. Xử lý Sự kiện Tìm kiếm & Filter Chips
    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderGrid();
    });

    document.getElementById('chips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentGroup = btn.dataset.group;
      renderGrid();
    });

    // 5. Modal Xử lý
    function openModal(id) {
      const item = GRAMMAR_DATA.find(x => x.id === id);
      if (!item) return;
      document.getElementById('mTitle').textContent = item.title;
      document.getElementById('mTag').textContent = item.group;
      document.getElementById('mBody').innerHTML = item.body;
      document.getElementById('modalOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
      document.body.style.overflow = '';
    }

    // Khởi chạy ban đầu
    renderGrid();
  </script>
</body>
</html>
