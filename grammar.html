<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Sơ Đồ Tư Duy Ngữ Pháp – EnglishFull</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .hero {
      color: #fff; text-align: center; padding: 46px 16px 70px;
      background: radial-gradient(800px 400px at 50% -10%, rgba(56,189,248,.3), transparent 70%),
                  linear-gradient(135deg, #061733 0%, #0c2a63 60%, #1a4a9c 100%);
    }
    .hero h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0 0 8px; font-weight: 800; }
    .hero p { margin: 0; opacity: .9; font-size: 1.05rem; }

    .wrap { max-width: 1100px; margin: -35px auto 60px; padding: 0 16px; }

    .bar-tools {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
      background: #fff; padding: 14px 20px; border-radius: 14px; border: 1px solid #cbd5e1;
      box-shadow: 0 4px 15px rgba(6,23,51,.04);
    }
    .status-text { font-weight: 700; color: #061733; font-size: 1rem; }
    .btn-sync {
      background: #061733; color: #fff; border: 0; padding: 9px 18px; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: .9rem; transition: background .15s;
    }
    .btn-sync:hover { background: #1a4a9c; }

    .tree-root { display: flex; flex-direction: column; gap: 24px; }
    
    .node-level-1 {
      background: #fff; border: 1.5px solid #061733; border-radius: 16px; padding: 20px 24px;
      box-shadow: 0 8px 24px rgba(6,23,51,.06);
    }
    .title-level-1 {
      font-size: 1.35rem; font-weight: 800; color: #061733; margin: 0 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid #e2e8f0; padding-bottom: 12px;
    }

    .branch-group {
      display: flex; flex-direction: column; gap: 12px;
      padding-left: 18px; border-left: 3px solid #38bdf8; margin-left: 8px;
    }

    .tree-node {
      background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 16px;
      position: relative;
    }
    .tree-node.leaf-node {
      background: #f0fdf4; border-color: #86efac; color: #166534; font-weight: 600;
    }

    .node-title {
      font-weight: 700; color: #0f172a; font-size: 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }

    .node-children {
      margin-top: 10px; display: flex; flex-direction: column; gap: 10px;
      padding-left: 16px; border-left: 2px dashed #93c5fd;
    }

    .badge-count {
      font-size: .75rem; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 99px; font-weight: 700;
    }

    .state-box {
      text-align: center; padding: 48px 20px; background: #fff; border-radius: 16px;
      border: 1px solid #cbd5e1; color: #64748b; font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="ef-header"></div>

  <section class="hero">
    <h1>Sơ Đồ Tư Duy Ngữ Pháp</h1>
    <p>Lộ trình phân nhánh tự động đồng bộ từ Google Sheet</p>
  </section>

  <main class="wrap">
    <div class="bar-tools">
      <span class="status-text" id="statusText">Cấu trúc Sơ Đồ Tư Duy</span>
      <button class="btn-sync" onclick="fetchSheetData()" id="btnSync">🔄 Tải lại từ Google Sheet</button>
    </div>

    <div class="tree-root" id="treeContainer">
      <div class="state-box">Đang tải dữ liệu từ Google Sheet...</div>
    </div>
  </main>

  <div id="ef-footer"></div>

  <!-- Nạp đúng thứ tự các file JS -->
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/util.js"></script>
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/core/auth.js"></script>
  <script src="assets/js/core/layout.js"></script>

  <script>
    if (typeof EF !== 'undefined' && EF.layout) {
      EF.layout.mountHeader(document.getElementById('ef-header'), { active: 'theory' });
      EF.layout.mountFooter(document.getElementById('ef-footer'));
    }

    function buildTreeFromPaths(paths) {
      const root = {};
      paths.forEach(path => {
        let current = root;
        path.forEach(step => {
          if (!current[step]) current[step] = {};
          current = current[step];
        });
      });
      return root;
    }

    function renderTreeNodes(obj, level = 1) {
      const keys = Object.keys(obj);
      if (keys.length === 0) return '';

      return keys.map(key => {
        const children = obj[key];
        const childKeys = Object.keys(children);
        const isLeaf = childKeys.length === 0;

        if (level === 1) {
          return `
            <div class="node-level-1">
              <h2 class="title-level-1">
                <span>📌 ${key}</span>
                <span class="badge-count">${childKeys.length} nhánh</span>
              </h2>
              <div class="branch-group">
                ${renderTreeNodes(children, level + 1)}
              </div>
            </div>
          `;
        } else {
          return `
            <div class="tree-node ${isLeaf ? 'leaf-node' : ''}">
              <div class="node-title">
                <span>${isLeaf ? '💡 ' : '🌿 '}${key}</span>
                ${!isLeaf ? `<span class="badge-count">\${childKeys.length}</span>` : ''}
              </div>
              ${!isLeaf ? `
                <div class="node-children">
                  \${renderTreeNodes(children, level + 1)}
                </div>
              ` : ''}
            </div>
          `;
        }
      }).join('');
    }

    function renderTree(paths) {
      const container = document.getElementById('treeContainer');
      if (!paths || paths.length === 0) {
        container.innerHTML = '<div class="state-box">Chưa có dữ liệu bài học trên Google Sheet. Hãy thêm dữ liệu vào Tab <b>TheoryRoadmap</b>.</div>';
        return;
      }
      const treeStructure = buildTreeFromPaths(paths);
      container.innerHTML = renderTreeNodes(treeStructure, 1);
    }

    function fetchSheetData() {
      const btn = document.getElementById('btnSync');
      const statusText = document.getElementById('statusText');
      btn.textContent = '⏳ Đang đọc dữ liệu...';
      statusText.textContent = 'Đang kết nối Google Sheet...';
      
      if (typeof EF !== 'undefined' && EF.api) {
        EF.api.get('getTheoryRoadmap', {})
          .then(function(res) {
            btn.textContent = '🔄 Tải lại từ Google Sheet';
            if (res && (res.ok || res.success) && Array.isArray(res.data) && res.data.length > 0) {
              statusText.textContent = 'Đã tải thành công ' + res.data.length + ' dòng dữ liệu!';
              renderTree(res.data);
            } else if (res && res.error) {
              statusText.textContent = 'Lỗi Backend Apps Script: ' + (res.message || res.error);
              renderTree([]);
            } else {
              statusText.textContent = 'Chưa có dữ liệu trên Google Sheet';
              renderTree([]);
            }
          })
          .catch(function(err) {
            btn.textContent = '🔄 Tải lại từ Google Sheet';
            statusText.textContent = 'Lỗi kết nối API';
            console.error('Lỗi khi gọi API:', err);
            renderTree([]);
          });
      } else {
        btn.textContent = '🔄 Tải lại từ Google Sheet';
        statusText.textContent = 'Chưa nạp được EF.api';
        renderTree([]);
      }
    }

    fetchSheetData();
  </script>
</body>
</html>
