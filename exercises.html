<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập – EnglishFull</title>
<style>
  :root{--n9:#061733;--n8:#0a2350;--n7:#0f3170;--n6:#164192;--blue:#2563eb;--sky:#38bdf8;--bg:#eef2f9;--ink:#0b1b3a;--muted:#5b6b8c;--line:#d9e2f3}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:150px}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{font-family:'Times New Roman',Times,serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input{font-family:inherit}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

  /* Header */
  .site-header{position:sticky;top:0;z-index:60;background:rgba(6,23,51,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
  .hd-in{max-width:1120px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{display:flex;align-items:center;gap:10px;color:#fff}
  .logo svg{width:44px;height:44px;flex:none}
  .logo b{display:block;font-size:1.2rem;line-height:1.1;letter-spacing:.3px}
  .logo small{display:block;font-size:.74rem;opacity:.75;line-height:1.2;font-style:italic}
  .nav{display:flex;gap:4px}
  .nav a{color:#dbe7ff;padding:8px 15px;border-radius:99px;font-weight:600;font-size:.93rem;transition:.15s}
  .nav a:hover{background:rgba(255,255,255,.12)}
  .nav a.on{background:#fff;color:var(--n8)}
  #lh{color:var(--sky)}

  /* Tiêu đề trang */
  .top{position:relative;overflow:hidden;color:#fff;text-align:center;padding:68px 16px 130px;
    background:radial-gradient(900px 420px at 85% -10%,rgba(56,189,248,.28),transparent 60%),
               radial-gradient(700px 380px at -5% 110%,rgba(37,99,235,.45),transparent 60%),
               linear-gradient(135deg,#061733 0%,#0c2a63 55%,#1a4a9c 100%)}
  .top::before{content:"";position:absolute;inset:0;opacity:.07;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}

  .top h1{margin:0 0 6px;font-size:3rem}
  .top p{margin:0;opacity:.88;font-style:italic}
  @media (max-width:520px){.top h1{font-size:1.65rem}}

  .wrap{max-width:1120px;margin:-44px auto 0;padding:0 14px 40px;position:relative}

  /* Thanh tìm kiếm + lọc nhóm */
  .tools{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(6,23,51,.12);margin-bottom:18px}
  .search{width:100%;padding:11px 14px;border:1.5px solid #bcd0f2;border-radius:10px;font-size:.98rem;background:#f6f9ff;outline:none}
  .search:focus{border-color:var(--n6);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  /* Bố cục 2 cột: panel trái + nội dung */
  .layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
  .side{position:sticky;top:76px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(6,23,51,.10)}
  .side-h{margin:0 0 10px;font-size:1.05rem;color:var(--n8)}
  .chips{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 170px);overflow-y:auto}
  .chip{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:var(--n7);padding:9px 12px;border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer;transition:.15s}
  .chip em{font-style:normal;font-size:.78rem;font-weight:700;background:#e4ecfb;color:var(--n7);padding:1px 9px;border-radius:99px}
  .chip:hover{background:#eef3fd}
  .chip.active{background:var(--n7);color:#fff}
  .chip.active em{background:rgba(255,255,255,.2);color:#fff}

  /* Điện thoại / màn hình hẹp: panel thành thanh cuộn ngang */
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .side{position:sticky;top:62px;z-index:30;padding:8px 10px}
    .side-h{display:none}
    .chips{flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;-webkit-overflow-scrolling:touch}
    .chip{flex:none;width:auto;border:1.5px solid #bcd0f2;border-radius:99px;padding:6px 14px;font-size:.86rem}
    .chip.active{border-color:var(--n7)}
  }

  /* Nhóm chuyên đề */
  .group{margin-bottom:22px}
  .group-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .group-h .gi{flex:none;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0a2350,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:700}
  .group-h h2{margin:0;font-size:1.3rem;color:var(--n8)}
  .group-h small{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px 14px 20px;position:relative;overflow:hidden;transition:.18s}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--blue),var(--sky))}
  .card h3{margin:0;font-size:1.05rem;color:var(--n7);overflow-wrap:anywhere}
  .card p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
  .go{margin-top:6px;font-weight:700;color:var(--blue);font-size:.9rem}
  a.card:hover{border-color:#7f9fdc;background:#f5f8ff;transform:translateY(-3px);box-shadow:0 12px 24px rgba(15,49,112,.14)}
  .card.soon{background:#f8faff}
  .card.soon::before{background:#c8d6f0}
  .card.soon .go{color:#8aa0cc}

  /* Trạng thái */
  .state{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 16px;text-align:center;color:var(--muted)}
  .spinner{width:30px;height:30px;border:4px solid #d6e2f8;border-top-color:var(--n6);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  .state.err{color:#991b1b;background:#fef2f2;border-color:#fecaca}
  .retry{margin-top:12px;border:0;background:var(--n7);color:#fff;padding:9px 18px;border-radius:10px;font-weight:700;cursor:pointer}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

    /* ===== Khối liên hệ / nhóm Zalo ===== */
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 10px 30px rgba(6,23,51,.10);margin-bottom:20px}
  .panel h2{margin:0 0 4px;color:var(--n8);font-size:1.45rem}
  .contact{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,#0a2350,#164192);border-color:transparent;color:#fff}
  .contact h2{color:#fff}
  .contact strong{color:#bfe3ff}
  .zalo-link:hover strong{color:#fff}
  .btn{display:inline-block;background:#fff;color:var(--n8);font-weight:700;padding:12px 22px;border-radius:12px;transition:.15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.qr{padding:8px}
  .btn img{display:block;width:140px;max-width:100%;height:auto;border-radius:8px}
  @media (max-width:520px){.btn img{width:120px}}

  footer{background:var(--n9);color:#c7d6f5;text-align:center;padding:22px 14px;font-size:.9rem}
</style>
</head>
<body>

<header class="site-header">
  <div class="hd-in">
    <a class="logo" id="logoLink" href="index.html" aria-label="EnglishFull – về trang chủ">
      <svg viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 18 64 V 28 C 25 24, 38 27, 45 31 V 67 C 38 63, 25 60, 18 64 Z"/>
          <path d="M 45 31 C 52 27, 65 24, 72 28 V 50"/>
          <path d="M 45 67 C 52 63, 65 60, 72 64"/>
          <path d="M 30 40 H 45" stroke-width="6"/>
          <path d="M 30 51 H 40" stroke-width="6"/>
          <path d="M 28 51 L 45 51 L 62 33 L 78 17" stroke-width="7"/>
          <path d="M 64 17 H 78 V 31" stroke-width="7"/>
        </g>
      </svg>
      <span><b>EnglishFull</b><small>Full English is here</small></span>
    </a>
    <nav class="nav" aria-label="Điều hướng">
        <a href="index.html" id="navHome">Trang chủ</a>
        <a href="exercises.html" class="on" id="navEx">Bài tập</a>
        <a id="lh" href="#lien-he" target="_self">Liên hệ</a>
      </nav>
  </div>
</header>

<section class="top">
  <h1>Bài tập theo chuyên đề</h1>
  <p>Chọn chuyên đề bạn muốn luyện.</p>
</section>



<main class="wrap">
  <div class="layout">
    <aside class="side" aria-label="Nhóm ngữ pháp">
      <h2 class="side-h">Nhóm ngữ pháp</h2>
      <nav class="chips" id="chips"></nav>
    </aside>

    <div class="content">
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="Tìm chuyên đề..." autocomplete="off" aria-label="Tìm chuyên đề">
      </div>
      <div id="list"><div class="state"><div class="spinner"></div>Đang tải danh sách chuyên đề...</div></div>
    </div>
  </div>
</main>

  <section class="panel contact" id="lien-he">
    <div>
      <h2>Cần hỗ trợ?</h2>
      <span>Câu nào không hiểu, join ngay <a class="zalo-link" href="https://zalo.me/g/afb7ondwiri8jkszt1g3" target="_blank" rel="noopener noreferrer"><strong>nhóm Zalo</strong></a></span>
    </div>
    <a class="btn qr" href="https://zalo.me/g/afb7ondwiri8jkszt1g3" target="_blank" rel="noopener noreferrer" aria-label="Vào nhóm Zalo">
      <img src="https://drive.google.com/thumbnail?id=1E1k4ZStxS7OnKTyK2CQWTEd1HyVzBRWd&sz=w400" alt="QR Nhóm Zalo">
    </a>
  </section>



<footer>© EnglishFull – Full English is here</footer>
<script>
  var API = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQ-RGif9lKcSMc2xUe6_lbvI-Qofr_oWbi6tROe1sitC61D76ebZ5C5nWDU_B35qubmQ5SDbSx2GBHS0mKXFuYr10EN5IDx1CP5eYjHi1GjLf2S1D-CgCPL4G9IREi_6UzUXQH4rcnshXhZyl3I7ApKmQSZ6twOV9A01d94PJW987PuPnPmcnPE8GPXbxg97eESh_vyLtTECM79CEEgq7Hylpk0vWCid_SAjUQXwubFdpKeBOo9hau_DiqAVWwFeplNhCxbwe8SsrhKw938YbFfdCmEFL_6QiDVP6s0&lib=MfSdDvpuZztosXXfVLvZjEGf4QMM86CMa';
  var DATA = [], activeGroup = '';

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function noAccent(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}

  function hrefOf(link){
    link = String(link||'').trim();
    if (!link) return null;
    if (/^https?:\/\//i.test(link)) return {url: link, ext: true};
    if (/^[A-Za-z0-9_-]+$/.test(link)) return {url: link + '.html', ext: false};
    return null;
  }

  function load(){
    document.getElementById('list').innerHTML = '<div class="state"><div class="spinner"></div>Đang tải danh sách chuyên đề...</div>';
    fetch(API)
      .then(function(res){ return res.json(); })
      .then(function(r){
        if (!r || !r.success) return fail(r && r.message);
        DATA = r.data; buildChips(); render();
      })
      .catch(function(e){ fail(String(e)); });
  }
  function fail(msg){
    document.getElementById('list').innerHTML = '<div class="state err">Không tải được danh sách chuyên đề.<br><small>' + esc(msg||'') + '</small><br><button class="retry" onclick="load()">Thử lại</button></div>';
  }

  function groups(){
    var seen = {}, out = [];
    DATA.forEach(function(t){ if(!seen[t.group]){ seen[t.group]=1; out.push(t.group); } });
    return out;
  }

  function buildChips(){
    var cnt = {};
    DATA.forEach(function(t){ cnt[t.group] = (cnt[t.group] || 0) + 1; });
    var h = '<button class="chip active" data-g=""><span>Tất cả</span><em>' + DATA.length + '</em></button>';
    groups().forEach(function(g){
      h += '<button class="chip" data-g="' + esc(g) + '"><span>' + esc(g) + '</span><em>' + cnt[g] + '</em></button>';
    });
    var c = document.getElementById('chips');
    c.innerHTML = h;
    activeGroup = '';
    c.onclick = function(e){
      var b = e.target.closest('.chip'); if(!b) return;
      activeGroup = b.getAttribute('data-g');
      [].forEach.call(c.children, function(x){ x.classList.toggle('active', x === b); });
      render();
    };
  }

  function render(){
    var q = noAccent(document.getElementById('q').value.trim());
    var by = {}, order = [];
    DATA.forEach(function(t){
      if (activeGroup && t.group !== activeGroup) return;
      if (q && noAccent(t.name + ' ' + t.desc + ' ' + t.group).indexOf(q) === -1) return;
      if (!by[t.group]) { by[t.group] = []; order.push(t.group); }
      by[t.group].push(t);
    });
    if (!order.length) {
      document.getElementById('list').innerHTML = '<div class="state">Không có chuyên đề nào khớp. Hãy thử từ khoá khác.</div>';
      return;
    }
    var h = '';
    order.forEach(function(g){
      h += '<section class="group"><div class="group-h"><div class="gi">★</div><div><h2>' + esc(g) + '</h2><small>' + by[g].length + ' chuyên đề</small></div></div><div class="grid">';
      by[g].forEach(function(t){
        var l = hrefOf(t.link), body = '<h3>' + esc(t.name) + '</h3>' + (t.desc ? '<p>' + esc(t.desc) + '</p>' : '<p></p>');
        if (l) h += '<a class="card" href="' + esc(l.url) + '" target="' + (l.ext ? '_blank" rel="noopener noreferrer' : '_self') + '">' + body + '<span class="go">Vào học ›</span></a>';
        else h += '<div class="card soon">' + body + '<span class="go">Sắp có</span></div>';
      });
      h += '</div></section>';
    });
    document.getElementById('list').innerHTML = h;
  }

  document.getElementById('q').addEventListener('input', render);
  load();
</script>
</body>
</html>
