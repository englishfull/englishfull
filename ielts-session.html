<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg"><title>IELTS Test – EnglishFull</title>
  <style>
    :root{--navy:#152b3e;--teal:#167d78;--teal-dark:#0f5e5a;--bg:#f2f5f7;--paper:#fff;--ink:#1b2834;--muted:#647484;--line:#dce3e8;--answered:#dff1e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Arial,sans-serif}.exam-header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}.exam-header-inner{max-width:1440px;margin:auto;min-height:60px;padding:8px 18px;display:flex;align-items:center;gap:16px}.exam-header a{color:#e7f2f5;text-decoration:none}.brand{font-weight:700;white-space:nowrap}.exam-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.timer{font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;background:#fff;color:var(--navy);padding:6px 12px;border-radius:5px}.wrap{max-width:1440px;margin:16px auto;padding:0 14px}.intro,.result{max-width:850px;margin:28px auto;padding:28px;background:#fff;border:1px solid var(--line);border-radius:12px}.intro h1{margin:5px 0 8px;color:var(--navy)}.muted{color:var(--muted)}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.meta span{border-radius:30px;background:#eef4f5;color:#34615f;padding:5px 10px;font-size:.88rem}.button{border:0;border-radius:6px;background:var(--teal);color:#fff;padding:10px 16px;font:700 .95rem Arial,sans-serif;cursor:pointer}.button:hover{background:var(--teal-dark)}.button:disabled{opacity:.5;cursor:default}.section-tabs{display:flex;gap:5px;overflow:auto;padding:0 0 9px}.section-tab,.part-tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#394d5e;padding:8px 13px;border-radius:7px 7px 0 0;cursor:pointer;font:700 .9rem Arial,sans-serif}.section-tab.active{background:var(--teal);border-color:var(--teal);color:#fff}.part-tabs{display:flex;gap:7px;overflow:auto;margin:4px 0 12px}.part-tab{border-radius:20px;font-weight:400;padding:6px 12px}.part-tab.active{background:#e1f1ef;border-color:#9accc7;color:var(--teal-dark);font-weight:700}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.95fr);gap:12px;align-items:stretch}.pane{min-height:420px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px;box-shadow:0 3px 12px #182b3d08}.pane h2{font-size:1.05rem;color:var(--navy);margin:0 0 14px}.pane-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}.passage{white-space:pre-wrap;overflow:auto;max-height:65vh;line-height:1.7}.empty-stimulus{color:var(--muted);font-style:italic}.pane audio{display:block;width:100%;margin:14px 0}.exam-image{display:block;max-width:100%;max-height:65vh;object-fit:contain;margin:12px auto}.resource{color:var(--teal-dark)}.q-kicker{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-dark);font-weight:700}.question-pane h2{margin:10px 0 18px;font-size:1.1rem}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer}.choice:hover{background:#f5f9f9}.choice input{margin-top:4px;accent-color:var(--teal)}.short-answer,.long-answer{width:100%;border:1px solid #b9c7d1;border-radius:6px;padding:11px;font:inherit}.long-answer{min-height:210px;resize:vertical}.word-count{text-align:right;color:var(--muted);font-size:.82rem;margin-top:4px}.exam-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.question-palette{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;align-items:center;gap:7px;overflow-x:auto}.palette-label{white-space:nowrap;color:var(--muted);font-size:.85rem}.question-nav-item{flex:0 0 36px;height:34px;border:1px solid #cbd6de;border-radius:5px;background:#fff;cursor:pointer}.question-nav-item.answered{background:var(--answered);border-color:#8ac1a3}.question-nav-item.current{outline:2px solid var(--teal);outline-offset:1px}.save-line{margin-left:auto;color:var(--muted);font-size:.88rem}.explanation{margin-top:12px;padding:10px;background:#f2f7f7;border-left:3px solid var(--teal);color:#4c5c68}.review-item{padding:12px;margin:10px 0;background:#f7f9fb;border-left:3px solid #d28b27}.result h2{margin-top:0}.result-score{font-size:1.1rem;font-weight:700;color:var(--navy)}.saved{color:#168253;font-weight:700}.loading{color:var(--muted)}[hidden]{display:none!important}@media(max-width:850px){.columns{grid-template-columns:1fr}.pane{min-height:260px}.passage{max-height:45vh}.exam-name{display:none}.exam-header-inner{gap:10px}.intro,.result{padding:22px}.exam-controls{flex-wrap:wrap}}
  </style>
</head>
<body data-mode="ielts">
  <header class="exam-header"><div class="exam-header-inner"><a class="brand" href="ielts.html">IELTS Practice</a><strong id="topTitle" class="exam-name">Đang tải đề</strong><span id="clock" class="timer">--:--</span></div></header>
  <main class="wrap">
    <section id="intro" class="intro"><div class="pane-label">Computer-based practice</div><h1 id="intro-title">Đang tải đề…</h1><p id="intro-desc" class="muted"></p><div id="intro-meta" class="meta"></div><p class="muted">Màn hình làm bài chia khu vực đề/nghe và câu trả lời, có chọn phần thi, bảng điều hướng và đồng hồ. Thời gian chạy liên tục sau khi bắt đầu.</p><button class="button" id="begin">Start test</button></section>
    <section id="stage" hidden><nav id="section-tabs" class="section-tabs" aria-label="Kỹ năng"></nav><nav id="part-tabs" class="part-tabs" aria-label="Part"></nav><div class="columns"><section class="pane" aria-label="Passage or audio"><div class="pane-label" id="stimulus-title"></div><div id="stimulus-content"></div></section><section class="pane question-pane" id="question-content" aria-live="polite"></section></div><div class="exam-controls"><button class="button" id="prev">← Previous</button><span id="progress" class="muted"></span><button class="button" id="next">Next →</button><button class="button" id="submit">Submit test</button></div><div class="question-palette"><span class="palette-label">Questions:</span><div id="question-nav" style="display:flex;gap:7px"></div><span class="save-line" id="save-line">Draft saved in this browser</span></div><section id="result" class="result" hidden></section></section>
  </main>
  <script src="exam-runner.js?v=20261014-2"></script>
</body>
</html>
