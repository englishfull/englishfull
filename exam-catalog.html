<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg"><title>Kho đề – EnglishFull</title>
<style>
:root{--navy:#061733;--blue:#164192;--accent:#2563eb;--bg:#eef2f9;--ink:#0b1b3a;--muted:#5b6b8c;--line:#d9e2f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Times New Roman",serif}a{color:inherit;text-decoration:none}.head{background:var(--navy);color:white;padding:14px 20px}.headin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:16px}.head a{color:#dbe7ff}.wrap{max-width:1100px;margin:34px auto;padding:0 16px}.hero{padding:28px;background:linear-gradient(135deg,#061733,#164192);color:white;border-radius:18px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#dbe7ff}.filters{margin:18px 0;display:flex;gap:8px;flex-wrap:wrap}.filters button{border:1px solid #bcd0f2;background:white;border-radius:99px;padding:8px 14px;cursor:pointer;font:inherit;color:var(--blue)}.filters button.active{background:var(--blue);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card,.state{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 8px 22px #06173312}.card{display:flex;flex-direction:column;min-height:150px;gap:8px}.card:hover{border-color:#7f9fdc;transform:translateY(-2px)}.tag{color:var(--blue);font-size:.86rem;font-weight:bold}.card h2{font-size:1.15rem;color:var(--blue);margin:0}.card p{color:var(--muted);margin:0;flex:1}.go{color:var(--accent);font-weight:bold}.state{text-align:center;color:var(--muted);padding:28px}footer{text-align:center;color:var(--muted);padding:24px}@media(max-width:600px){.hero{padding:22px}.headin{flex-direction:column}}
.filters{align-items:end;gap:10px}.filters label{display:grid;gap:5px;color:var(--muted);font-size:.88rem;font-weight:bold}.filters select,.filters input{min-width:180px;border:1px solid #bcd0f2;background:white;border-radius:9px;padding:9px 12px;font:inherit;color:var(--ink)}.filters input{min-width:min(280px,80vw)}.count{color:var(--muted);font-size:.9rem;margin:0 0 10px}@media(max-width:600px){.filters label,.filters select{width:100%}}
</style></head><body><header class="head"><div class="headin"><a href="index.html"><b>EnglishFull</b> · Kho đề</a><nav><a href="exercises.html">Bài tập</a>　<a href="history.html">Lịch sử</a></nav></div></header><main class="wrap"><section class="hero"><h1 id="title">Kho đề</h1><p id="intro"></p></section><div class="filters" id="filters"></div><p class="count" id="count"></p><div id="list"><div class="state">Đang tải danh sách đề...</div></div></main><footer>Đề thi được tải từ Google Sheets.</footer>
<script>
const BASE='https://script.google.com/macros/s/AKfycbwtDxkcEL5lDNPBt0gxe0P59rb2HZacd9z6CVXbHWYlA17s2w2hRcD7UyRVx7PZ1IJn/exec';
const track=new URLSearchParams(location.search).get('track')==='ielts'?'ielts':'school';
let exams=[],level='',kind='',search='';
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function pieces(exam){return String(exam.group||'Khác').split(/\s*[·|]\s*/).map(x=>x.trim()).filter(Boolean)}
function levelOf(exam){
  const p=pieces(exam),school=p.find(x=>/^THCS$|^THPT$/i.test(x)),grade=p.find(x=>/^Lớp\s+\d+/i.test(x));
  return [school,grade].filter(Boolean).join(' · ')||'Khác';
}
function kindOf(exam){
  const p=pieces(exam);
  if(track==='ielts')return p.filter(x=>!/^IELTS$/i.test(x)).join(' · ')||'IELTS';
  return p.filter(x=>!/^THCS$|^THPT$/i.test(x)&&!/^Lớp\s+\d+/i.test(x)).join(' · ')||'Khác';
}
function fillSelect(id,label,values,selected){
  return '<label>'+label+'<select id="'+id+'"><option value="">Tất cả</option>'+values.map(v=>'<option value="'+esc(v)+'"'+(v===selected?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>';
}
$('title').textContent=track==='ielts'?'IELTS':'Đề thi THCS & THPT';
$('intro').textContent=track==='ielts'?'Chọn kỹ năng hoặc đề thi thử, làm bài theo thời gian và từng phần như phòng thi.':'Chọn cấp/lớp và dạng kiểm tra để luyện theo cấu trúc đề ở trường.';
document.title=$('title').textContent+' – EnglishFull';
function draw(){
  const shown=exams.filter(x=>(!level||levelOf(x)===level)&&(!kind||kindOf(x)===kind)&&(!search||norm([x.title,x.desc,x.group].join(' ')).includes(norm(search))));
  $('count').textContent=shown.length+' đề';
  $('list').innerHTML=shown.length?'<div class="grid">'+shown.map(x=>'<a class="card" href="exam-session.html?id='+encodeURIComponent(x.id)+'&track='+track+'"><span class="tag">'+esc(x.group)+' · '+(x.duration||'—')+' phút</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.desc)+'</p><span class="go">Bắt đầu làm đề ›</span></a>').join('')+'</div>':'<div class="state">Không có đề phù hợp. Hãy đổi bộ lọc hoặc tìm kiếm lại.</div>';
}
function buildFilters(){
  const levels=[...new Set(exams.map(levelOf))].sort((a,b)=>a.localeCompare(b,'vi'));
  const kinds=[...new Set(exams.map(kindOf))].sort((a,b)=>a.localeCompare(b,'vi'));
  $('filters').innerHTML=(track==='school'?fillSelect('level','Cấp / lớp',levels,level):'')+
    fillSelect('kind',track==='ielts'?'Kỹ năng / dạng đề':'Kỳ / dạng đề',kinds,kind)+
    '<label for="search">Tìm đề / lớp / kỳ<input id="search" type="search" placeholder="Ví dụ: lớp 9, giữa kì I" value="'+esc(search)+'"></label>';
  const levelSelect=$('level');if(levelSelect)levelSelect.onchange=()=>{level=levelSelect.value;draw()};
  $('kind').onchange=()=>{kind=$('kind').value;draw()};
  $('search').oninput=()=>{search=$('search').value;draw()};
}
fetch(BASE+'?api=exam_list&track='+track).then(r=>r.json()).then(r=>{
  if(!r.success)throw Error(r.message||'Lỗi tải đề');
  exams=r.data||[];buildFilters();draw();
}).catch(e=>{$('count').textContent='';$('list').innerHTML='<div class="state">Không tải được danh sách: '+esc(e.message)+'</div>'});
</script></body></html>
